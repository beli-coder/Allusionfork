# Builds the Windows installer and portable exe on every push.
# The artifacts are kept for 7 days and can be downloaded from the Actions tab.
name: Windows build

on:
  push:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Build app
        run: yarn build

      - name: Package Windows binaries
        run: yarn electron-builder --win --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: |
            dist/*.exe
          retention-days: 7
