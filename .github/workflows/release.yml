# Builds and publishes a GitHub Release when a version tag (v*) is pushed.
# Artifacts: Linux AppImage, Windows NSIS installer + portable exe, macOS dmg.
name: Build/release

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Build app
        run: yarn build

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable macOS code-signing auto-discovery (no certs in this repo)
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: yarn electron-builder --publish always
